    <!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <title>Список групп</title>
        <link rel="stylesheet" href="../../shared/base.css">
        <link rel="stylesheet" href="../../shared/components.css">
        <link rel="stylesheet" href="list.css">
    </head>
    <body>

        <div id="header"></div>

        <main>
            <h1>Список групп</h1>
            <div class="field">
                <label for="filterName">Поиск по названию</label>
                <input id = 'filterName'> 
            </div>

            <button class = "btn btn--primary">
                Добавить группу
            </button>

            <!-- Куча дряни СПРОСИТЬ У ДЕНИСА чо делать-->
            <div class="field"> 
                <label for = "filterYearOfStudy"> Номер курса</label>
                <select id = "filterYearOfStudy">
                    <option value=''>Все курсы</option>
                    <option value="1">1 курс</option>
                    <option value="2">2 курс</option>
                    <option value="3">3 курс</option>
                    <option value="4">4 курс</option>
                </select>
            </div>
            <div class="field"> 
                <label for = "filterEduForm" >Вид обучения</label>
                <select id = "filterEduForm">
                    <option value=''>Все виды обучения</option>
                    <option value="budget">Бюджет</option>
                    <option value="contract">Контракт</option>
                </select>
            </div>
            <table>
                <thead>        
                    <tr>       
                    <th>id</th>    
                    <th>Название</th>       
                    <th>Курс</th>
                    <th>Специальность</th>       
                    <th>Форма</th>
                    <th>Год</th>       
                    <th>Студентов</th> <!-- оно вообще наверно само должно считаться хз-->
                    <th>Действия</th>
                    </tr>
                </thead>
                <tbody id = "groups-body">

                </tbody>
            </table>
        </main>

        <div id="footer"></div>
        



        <!--модалка изменения данных-->
        <form id="editingModal" class="modal hidden">
            <div class="field" name = "name">
                <label for = "editName">Наименование</label>
                <input id = editName>
            </div>

            <div class="field">
                <label for = "editYearOfStudy">Курс</label>
                <select id = "editYearOfStudy" name = "yearOfStudy">
                    <option value="1">1 курс</option>
                    <option value="2">2 курс</option>
                    <option value="3">3 курс</option>
                    <option value="4">4 курс</option>
                    <option value="5">5 курс</option>
                    <option value="6">6 курс</option>
                </select>
            </div>
            <div class="field">
                <label for = "editSpecialization">Специализация</label>
                <input id = editSpecialization  name = "specialization">
            </div>
            <div class="field">
                <label for = "editForm">Форма</label>
                <select id = "editForm" name = "form">
                    <option value=''>Все виды обучения</option>
                    <option value="budget">Бюджет</option>
                    <option value="contract">Контракт</option>
                </select>
            </div>
            <div class="field">
                <label for = "editAdmissionYear">Год поступления</label>
                <input id = editAdmissionYear name = "admissionYear" type="number">
            </div>
            <div class="field">
                <label for = "editStudentCount">Количество студентов</label>
                <input id = editStudentCount name = "studentCount" type="number">
            </div>

            <div>
                <button type = "submit"  class="btn btn--primary">Сохранить</button>
                <button type = "button"class="btn btn--secondary">Отменить</button>
            </div>
        </form>


        <script src="../../shared/menu-config.js"></script>
        <script src="../../shared/components.js"></script>
        <script src="list.js"></script>
        <script>
            
            document.getElementById('header').innerHTML = renderHeader();
            document.getElementById('footer').innerHTML = renderFooter();
        </script>

    </body>
    </html>
