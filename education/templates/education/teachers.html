{% extends 'education/base.html' %}
{% load static %}

{% block title %}Преподаватели{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'pages/teachers/style.css' %}">
{% endblock %}

{% block content %}
    <h1>Список преподавателей</h1>
    <div class = "toolbar">
        <div class="field">
            <label for="filterName">Поиск по ФИО</label>
            <input id="filterName"> 
        </div>

        <div class="field"> 
            <label for="filterDepartment">Кафедра</label>
            <select id="filterDepartment">
                <option value=''>Все кафедры</option>
                {% for dept in departments %}
                    <option value="{{ dept.id }}">{{ dept.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="field"> 
            <label for="filterPosition">Должность</label>
            <select id="filterPosition">
                <option value=''>Все должности</option>
                {% for value, label in positions %}
                    <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        
        <button class="btn btn--primary" id="addTeacherBtn">Добавить преподавателя</button>
        
    </div>
    <table>
        <thead>        
            <tr>       
                <th>ID</th>    
                <th>ФИО</th>       
                <th>Кафедра</th>
                <th>Должность</th>       
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="teachers-body"></tbody>
    </table>

    <div id="editingModal" class="modal hidden">
        <form id="editFormTag"> 
            <input type="hidden" id="editId"> 
            
            <div class="field">
                <label for="editLastName">Фамилия</label>
                <input id="editLastName" required>
            </div>
            <div class="field">
                <label for="editFirstName">Имя</label>
                <input id="editFirstName" required>
            </div>
            <div class="field">
                <label for="editMiddleName">Отчество</label>
                <input id="editMiddleName">
            </div>
            
            <div class="field">
                <label for="editDepartment">Кафедра</label>
                <select id="editDepartment">
                    <option value="">Без кафедры</option>
                    {% for dept in departments %}
                        <option value="{{ dept.id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="editPosition">Должность</label>
                <select id="editPosition">
                    {% for value, label in positions %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="editDegree">Ученая степень</label>
                <select id="editDegree">
                    <option value="">Нет степени</option>
                    {% for value, label in degrees %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="editEmail">Email</label>
                <input id="editEmail" type="email" required>
            </div>
            
            <div class="field">
                <label for="editPhone">Телефон</label>
                <input id="editPhone">
            </div>

            <div>
                <button type="submit" class="btn btn--primary">Сохранить</button>
                <button type="button" class="btn btn--secondary" id="cancelEditBtn">Отменить</button>
            </div>
        </form>
    </div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'pages/teachers/script.js' %}"></script>
{% endblock %}
