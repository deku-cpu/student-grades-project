{% extends 'education/base.html' %}
{% load static %}

{% block title %}Студенты{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'pages/students/style.css' %}">
{% endblock %}

{% block content %}
    <h1>Список студентов</h1>
    
    <div class="field">
        <label for="filterName">Поиск по ФИО</label>
        <input id="filterName"> 
    </div>

    <button class="btn btn--primary" id="addStudentBtn">Добавить студента</button>

    <div class="field"> 
        <label for="filterGroup">Группа</label>
        <select id="filterGroup">
            <option value=''>Все группы</option>
            {% for g in groups %}
                <option value="{{ g.id }}">{{ g.name }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="field"> 
        <label for="filterForm">Форма обучения</label>
        <select id="filterForm">
            <option value=''>Все формы</option>
            {% for value, label in education_forms %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="field"> 
        <label for="filterStatus">Статус</label>
        <select id="filterStatus">
            <option value=''>Все статусы</option>
            {% for value, label in statuses %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <table>
        <thead>        
            <tr>       
                <th>ID</th>    
                <th>ФИО</th>       
                <th>Группа</th>
                <th>Форма</th>       
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="students-body"></tbody>
    </table>

    <div id="editingModal" class="modal hidden">
        <form id="editFormTag"> 
            <input type="hidden" id="editId"> 
            
            <div class="field">
                <label for="editLastName">Фамилия</label>
                <input id="editLastName" required>
            </div>
            <div class="field">
                <label for="editFirstName">Имя</label>
                <input id="editFirstName" required>
            </div>
            <div class="field">
                <label for="editMiddleName">Отчество</label>
                <input id="editMiddleName">
            </div>
            
            <div class="field">
                <label for="editGroup">Группа</label>
                <select id="editGroup">
                    <option value="">Без группы</option>
                    {% for g in groups %}
                        <option value="{{ g.id }}">{{ g.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="editForm">Форма обучения</label>
                <select id="editForm">
                    {% for value, label in education_forms %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="editStatus">Статус</label>
                <select id="editStatus">
                    {% for value, label in statuses %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="editEmail">Email</label>
                <input id="editEmail" type="email" required>
            </div>
            
            <div class="field">
                <label for="editPhone">Телефон</label>
                <input id="editPhone">
            </div>

            <div class="field">
                <label for="editGender">Пол</label>
                <select id="editGender">
                    {% for value, label in genders %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="editDob">Дата рождения</label>
                <input id="editDob" type="date">
            </div>
            
            <div class="field">
                <label for="editAdmission">Дата поступления</label>
                <input id="editAdmission" type="date">
            </div>

            <div>
                <button type="submit" class="btn btn--primary">Сохранить</button>
                <button type="button" class="btn btn--secondary" id="cancelEditBtn">Отменить</button>
            </div>
        </form>
    </div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'pages/students/script.js' %}"></script>
{% endblock %}
