{% extends 'education/base.html' %}
{% load static %}

{% block title %}Мои предметы{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'pages/teacher/disciplines/style.css' %}">
{% endblock %}

{% block content %}
    <h1>Мои предметы</h1>

    <div class="field">
        <label for="search_discipline">Поиск по дисциплине</label>
        <input id="search_discipline"> 
    </div>

    <div class="field">
        <label for="search_group">Поиск по группе</label>
        <input id="search_group"> 
    </div>

    <select id="filter_course">
        <option value=''>Все курсы</option>
        {% for course in courses %}
            <option value="{{ course }}">{{ course }} курс</option>
        {% endfor %}
    </select>


    <table>
        <thead>        
            <tr>       
                <th>Группа</th>    
                <th>Курс</th>
                <th>Дисциплина</th>       
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="disciplines-body">
            
        </tbody>
    </table>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'pages/teacher/disciplines/script.js' %}"></script>
{% endblock %}
