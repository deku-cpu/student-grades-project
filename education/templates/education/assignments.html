{% extends 'education/base.html' %}
{% load static %}

{% block title %}Задания для пары{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'pages/assignments/style.css' %}">
{% endblock %}

{% block content %}
    <!-- Заголовок будет заполнен через JS (Группа - Дисциплина) -->
    <h1 id="page-title">Загрузка...</h1>
    
    <a href="/teachings/" class="btn btn--secondary" style="margin-bottom: 20px;">← Назад к парам</a>

    <button class="btn btn--primary" id="addAssignmentBtn">Добавить задание</button>

    <table>
        <thead>        
            <tr>       
                <th>ID</th>    
                <th>Название</th>       
                <th>Тип</th>
                <th>Вес</th>       
                <th>Порядок</th>
                <th>Дата</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="assignments-body"></tbody>
    </table>

    <!-- Модалка для создания/редактирования -->
    <div id="editingModal" class="modal hidden">
        <form id="editFormTag"> 
            <input type="hidden" id="editId"> 
            
            <div class="field">
                <label for="editTitle">Название (например, Лабораторная №1)</label>
                <input id="editTitle" required>
            </div>

            <div class="field">
                <label for="editType">Тип работы</label>
                <select id="editType" required>
                    <option value="">Выберите тип...</option>
                    {% for value, label in grade_types %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="editWeight">Вес (от 1 до 100)</label>
                <input id="editWeight" type="number" min="1" max="100" required>
            </div>

            <div class="field">
                <label for="editOrder">Порядок вывода (по умолчанию 0)</label>
                <input id="editOrder" type="number" value="0">
            </div>

            <div class="field">
                <label for="editDate">Дата (необязательно)</label>
                <input id="editDate" type="date">
            </div>

            <div>
                <button type="submit" class="btn btn--primary">Сохранить</button>
                <button type="button" class="btn btn--secondary" id="cancelEditBtn">Отменить</button>
            </div>
        </form>
    </div>
    
    <!-- Передаем ID пары в JS -->
    <div id="config" data-teaching-id="{{ teaching_id }}"></div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'pages/assignments/script.js' %}"></script>
{% endblock %}
