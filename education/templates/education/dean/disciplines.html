{% extends 'education/base.html' %}
{% load static %}

{% block title %}Дисциплины{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'pages/dean/disciplines/style.css' %}">
{% endblock %}

{% block content %}
    <h1>Дисциплины</h1>

    <div class="toolbar">
        <div class="field">
            <label for="filterSearch">Поиск по названию</label>
            <input id="filterSearch">
        </div>

        <div class="field">
            <label for="filterControlForm">Форма контроля</label>
            <select id="filterControlForm">
                <option value="">Все</option>
                {% for value, label in control_forms %}
                    <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>

        <button class="btn btn--primary" id="addDisciplineBtn">Добавить дисциплину</button>
    </div>

    <table>
        <thead>        
            <tr>       
                <th>ID</th>    
                <th>Название</th>       
                <th>Лекции</th>
                <th>Практики</th>       
                <th>Лабы</th>
                <th>Контроль</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="disciplines-body"></tbody>
    </table>

    <!-- Модалка -->
    <div id="editingModal" class="modal hidden">
        <form id="editFormTag"> 
            <input type="hidden" id="editId"> 
            
            <div class="field">
                <label for="editName">Название</label>
                <input id="editName" required>
            </div>

            <div class="field">
                <label for="editDescription">Описание (необязательно)</label>
                <textarea id="editDescription" rows="3"></textarea>
            </div>

            <div class="field">
                <label for="editHoursLecture">Часы (лекции)</label>
                <input id="editHoursLecture" type="number" min="0" value="0" required>
            </div>

            <div class="field">
                <label for="editHoursPractice">Часы (практики)</label>
                <input id="editHoursPractice" type="number" min="0" value="0" required>
            </div>

            <div class="field">
                <label for="editHoursLab">Часы (лабораторные)</label>
                <input id="editHoursLab" type="number" min="0" value="0" required>
            </div>

            <div class="field">
                <label for="editControlForm">Форма контроля</label>
                <select id="editControlForm" required>
                    <option value="">Выберите...</option>
                    {% for value, label in control_forms %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <button type="submit" class="btn btn--primary">Сохранить</button>
                <button type="button" class="btn btn--secondary" id="cancelEditBtn">Отменить</button>
            </div>
        </form>
    </div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'pages/dean/disciplines/script.js' %}"></script>
{% endblock %}
