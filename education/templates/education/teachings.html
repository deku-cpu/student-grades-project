{% extends 'education/base.html' %}
{% load static %}

{% block title %}Учебный план{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'pages/teachings/style.css' %}">
{% endblock %}

{% block content %}
    <h1>Учебный план (Пары)</h1>
    
    <div class="field">
        <label for="filterSearch">Поиск по группе или дисциплине</label>
        <input id="filterSearch"> 
    </div>

    <button class="btn btn--primary" id="addTeachingBtn">Добавить пару</button>

    <table>
        <thead>        
            <tr>       
                <th>ID</th>    
                <th>Группа</th>       
                <th>Дисциплина</th>
                <th>Преподаватель</th>       
                <th>Семестр</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="teachings-body"></tbody>
    </table>

    <div id="editingModal" class="modal hidden">
        <form id="editFormTag"> 
            <input type="hidden" id="editId"> 
            
            <div class="field">
                <label for="editGroup">Группа</label>
                <select id="editGroup" required>
                    <option value="">Выберите группу...</option>
                    {% for g in groups %}
                        <option value="{{ g.id }}">{{ g.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="editDiscipline">Дисциплина</label>
                <select id="editDiscipline" required>
                    <option value="">Выберите дисциплину...</option>
                    {% for d in disciplines %}
                        <option value="{{ d.id }}">{{ d.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="editTeacher">Преподаватель</label>
                <select id="editTeacher" required>
                    <option value="">Выберите преподавателя...</option>
                    {% for t in teachers %}
                        <option value="{{ t.id }}">{{ t.last_name }} {{ t.first_name }} {{ t.middle_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="field">
                <label for="editSemester">Семестр</label>
                <select id="editSemester" required>
                    <option value="">Выберите семестр...</option>
                    {% for s in semesters %}
                        <option value="{{ s.id }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <button type="submit" class="btn btn--primary">Сохранить</button>
                <button type="button" class="btn btn--secondary" id="cancelEditBtn">Отменить</button>
            </div>
        </form>
    </div>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'pages/teachings/script.js' %}"></script>
{% endblock %}
